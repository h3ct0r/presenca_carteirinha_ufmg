; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
board = esp32-p4-evboard
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_model.csv

; Injects -D APP_GIT_SHA=<short sha> so include/app/version.h can report the
; exact build (About screen + boot log). Falls back to "nogit" harmlessly.
extra_scripts = pre:tools/build/version_flags.py

build_type = release
build_flags =
    -D BOARD_HAS_PSRAM
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -Os
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    ; ESP_LOG*/log_* visibility: Arduino's logger is gated by CORE_DEBUG_LEVEL (3 = INFO)
    -D CORE_DEBUG_LEVEL=3
    ; Battery drain log (debug): uncomment to append every battery sample to
    ; /battery.csv as "uptime_s,mv,pct", for measuring how long a charge lasts.
    ; Off by default — it writes to the SD card every SAMPLE_PERIOD_MS (10 s),
    ; roughly 130 KB/day, and never rotates. See storage/battery_log.h.
    ; -D BATTERY_DRAIN_LOG
    ; --- esp-dl (vendored, lib/esp-dl): include paths mirror its CMake include_dirs ---
    -I lib/esp-dl/dl
    -I lib/esp-dl/dl/tool/include
    -I lib/esp-dl/dl/tensor/include
    -I lib/esp-dl/dl/base
    -I lib/esp-dl/dl/base/isa
    -I lib/esp-dl/dl/base/isa/esp32p4
    -I lib/esp-dl/dl/math/include
    -I lib/esp-dl/dl/model/include
    -I lib/esp-dl/dl/module/include
    -I lib/esp-dl/fbs_loader/include
    -I lib/esp-dl/vision/detect
    -I lib/esp-dl/vision/image
    -I lib/esp-dl/vision/image/isa
    -I lib/esp-dl/vision/recognition
    -I lib/esp-dl/vision/classification
    -I lib/human_face_detect
    ; prebuilt flatbuffer model parser that ships with esp-dl
    -L lib/esp-dl/fbs_loader/lib/esp32p4
    -lfbs_model
    ; esp-dl Kconfig defaults: all pixel-format conversions enabled
    -D CONFIG_PIX_CVT_RGB565_TO_RGB565_SUPPORT=1
    -D CONFIG_PIX_CVT_RGB565_TO_RGB888_SUPPORT=1
    -D CONFIG_PIX_CVT_RGB565_TO_GRAY_SUPPORT=1
    -D CONFIG_PIX_CVT_RGB565_TO_HSV_SUPPORT=1
    -D CONFIG_PIX_CVT_RGB888_TO_RGB888_SUPPORT=1
    -D CONFIG_PIX_CVT_RGB888_TO_RGB565_SUPPORT=1
    -D CONFIG_PIX_CVT_RGB888_TO_GRAY_SUPPORT=1
    -D CONFIG_PIX_CVT_RGB888_TO_HSV_SUPPORT=1
    -D CONFIG_PIX_CVT_GRAY_TO_GRAY_SUPPORT=1
    -D CONFIG_PIX_CVT_HSV_TO_HSV_MASK_SUPPORT=1
    -D CONFIG_PIX_CVT_YUV_TO_RGB888_SUPPORT=1
    -D CONFIG_PIX_CVT_YUV_TO_RGB565_SUPPORT=1
    -D CONFIG_PIX_CVT_YUV_TO_GRAY_SUPPORT=1
    -D CONFIG_PIX_CVT_YUV_TO_HSV_SUPPORT=1
    -D CONFIG_PIX_CVT_YUV_TO_YUV_SUPPORT=1
    ; human_face_detect config (Kconfig equivalents): MSR+MNP model, loaded from
    ; the SD card (/sdcard/models/*.espdl) — no partition packing/flashing needed.
    -D CONFIG_FLASH_HUMAN_FACE_DETECT_MSRMNP_S8_V1=1
    -D CONFIG_HUMAN_FACE_DETECT_MSRMNP_S8_V1=1
    -D CONFIG_DEFAULT_HUMAN_FACE_DETECT_MODEL=0
    -D CONFIG_HUMAN_FACE_DETECT_MODEL_IN_SDCARD=1
    -D CONFIG_HUMAN_FACE_DETECT_MODEL_SDCARD_DIR=\"models\"
    ; compile the face-detection path in face_detection_service.cpp
    -D USE_FACE_DETECT
build_unflags =
    -Og
    -g
lib_deps =
    lvgl/lvgl@^9.5.0
    adafruit/Adafruit PN532@^1.3.4
    bblanchon/ArduinoJson@^7.2.0
; hw_mocks is native-test only. human_face_detect + esp-dl provide real face
; detection, compiled in via -D USE_FACE_DETECT above.
lib_ignore = hw_mocks
; On-target tests would live in test/embedded/ (none yet).
test_filter = embedded/*

; Host-side unit tests: `pio test -e native`. Compiles the hardware-free
; application sources (app/, the SD-facing services, storage) against the
; mock hardware in lib/hw_mocks (in-memory SD card, fake PN532, fake JPEG
; encoder, pthread-backed FreeRTOS), and runs Unity test suites from
; test/native/. See test/README.md.
[env:native]
platform = native
test_framework = unity
test_filter = native/*
test_build_src = yes
build_type = debug
build_flags =
    -std=gnu++17
    -pthread
    -D NATIVE_TEST
build_src_filter =
    -<*>
    +<app/>
    +<services/config_service.cpp>
    +<services/roster_service.cpp>
    +<services/import_service.cpp>
    +<services/rfid_service.cpp>
    +<services/export_service.cpp>
    +<storage/sd_card.cpp>
    +<storage/sd_tree.cpp>
    +<storage/photo_store.cpp>
    +<storage/attendance_store.cpp>
    +<storage/backup_store.cpp>
    +<storage/battery_log.cpp>
    +<storage/checkin_store.cpp>
lib_deps =
    bblanchon/ArduinoJson@^7.2.0