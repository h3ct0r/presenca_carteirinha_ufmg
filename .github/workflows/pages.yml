name: Deploy site

on:
  push:
    branches: [main]
  # Release publishes assets with GITHUB_TOKEN — that does not fire
  # `release: published` for other workflows. Redeploy after Release completes.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # Skip redeploy when the Release workflow failed
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Always deploy from main — workflow_run after a tag Release otherwise
      # leaves the job on a non-main ref and the github-pages environment
      # branch policy can leave the run stuck in "queued".
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble site (hub + config-builder + flasher)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _site
          touch _site/.nojekyll

          # Hub (tabs home)
          cp docs/site/index.html docs/site/hub.css _site/

          # Config builder (runtime only — no tests/docs)
          mkdir -p _site/config/src _site/config/fixtures
          cp tools/config-builder/index.html _site/config/
          cp tools/config-builder/src/*.js _site/config/src/
          cp tools/config-builder/fixtures/example.model.json _site/config/fixtures/

          # Firmware installer
          mkdir -p _site/firmware
          cp -a docs/flasher/. _site/firmware/
          rm -f _site/firmware/.gitignore
          mkdir -p _site/firmware/bins

          # Same-origin bins for the flasher (avoids GitHub Releases CORS)
          downloaded=0
          for tag in $(gh release list --repo "${{ github.repository }}" --limit 12 \
            --json tagName -q '.[].tagName'); do
            if gh release download "$tag" --repo "${{ github.repository }}" \
              -p 'rfid-attendance-*-firmware.bin' \
              -p 'rfid-attendance-*-bootloader.bin' \
              -p 'rfid-attendance-*-partitions.bin' \
              -D _site/firmware/bins --clobber; then
              downloaded=$((downloaded + 1))
              echo "OK: $tag"
              # Face-detection models, fetched separately and allowed to fail:
              # releases from before the models moved into flash have no such
              # asset, and they must keep installing without one.
              gh release download "$tag" --repo "${{ github.repository }}" \
                -p 'rfid-attendance-*-models.bin' \
                -D _site/bins --clobber \
                || echo "note: $tag has no models bin (pre-flash-models release)"
            else
              echo "WARN: incomplete bins for $tag (skipped)"
            fi
          done
          echo "Downloaded ${downloaded} firmware bin(s)"
          ls -la _site/firmware/bins/ || echo "No release bins yet"
          if [ "$downloaded" -eq 0 ]; then
            echo "::warning::No firmware bins copied yet — installer UI will show empty until a v* Release exists"
          fi

          # Compatibility redirect for bookmarks that used /install.html
          printf '%s\n' \
            '<!DOCTYPE html><meta charset="utf-8" />' \
            '<title>Redirecting…</title>' \
            '<meta http-equiv="refresh" content="0; url=firmware/" />' \
            '<link rel="canonical" href="firmware/" />' \
            '<p><a href="firmware/">Firmware installer</a></p>' \
            > _site/install.html

          echo "Site tree:"
          find _site -maxdepth 3 -type f | head -60

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
