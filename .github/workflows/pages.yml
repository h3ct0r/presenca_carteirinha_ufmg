name: Deploy flasher

on:
  push:
    branches: [main]
  # Release publishes assets with GITHUB_TOKEN — that does not fire
  # `release: published` for other workflows. Redeploy after Release completes.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # Skip redeploy when the Release workflow failed
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Always deploy from main — workflow_run after a tag Release otherwise
      # leaves the job on a non-main ref and the github-pages environment
      # branch policy can leave the run stuck in "queued".
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare installer (bins on same origin — avoids CORS)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site
          cp -a docs/flasher/. _site/
          mkdir -p _site/bins
          touch _site/.nojekyll
          downloaded=0
          for tag in $(gh release list --repo "${{ github.repository }}" --limit 12 \
            --json tagName -q '.[].tagName'); do
            # Full ESP32-P4 flash needs bootloader + partitions + app (PIO layout).
            if gh release download "$tag" --repo "${{ github.repository }}" \
              -p 'rfid-attendance-*-firmware.bin' \
              -p 'rfid-attendance-*-bootloader.bin' \
              -p 'rfid-attendance-*-partitions.bin' \
              -D _site/bins --clobber; then
              downloaded=$((downloaded + 1))
              echo "OK: $tag"
            else
              echo "WARN: incomplete bins for $tag (skipped)"
            fi
          done
          echo "Downloaded ${downloaded} firmware bin(s)"
          ls -la _site/bins/ || echo "No release bins yet"
          if [ "$downloaded" -eq 0 ]; then
            echo "::warning::No firmware bins copied yet — installer UI will show empty until a v* Release exists"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
