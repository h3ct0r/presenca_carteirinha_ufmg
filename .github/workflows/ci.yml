# Host-side tests plus an esp32p4 compile smoke check on every push/PR to main.
# Tagged releases (release.yml) re-run tests, rebuild, and publish firmware.bin.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    name: Native unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/platforms
            ~/.platformio/packages
          key: pio-native-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-native-${{ runner.os }}-

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          pip install --upgrade platformio

      - name: Run native tests
        run: pio test -e native

  config-builder-tests:
    name: Config-builder tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run config-builder unit tests
        working-directory: tools/config-builder
        run: node --test

  firmware-build:
    name: Firmware build smoke (esp32p4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/platforms
            ~/.platformio/packages
          key: pio-esp32p4-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-esp32p4-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Compile firmware
        run: pio run -e esp32p4

      - name: Assert firmware.bin was produced
        run: test -f .pio/build/esp32p4/firmware.bin && ls -lh .pio/build/esp32p4/firmware.bin
